# =============================================================================
#  CONFIGURAÇÃO DO GRUPO - preencha todos os campos marcados com TODO.
#  Este arquivo é lido pelo código base, pelo notebook e pelo script de
#  avaliação. Mantenha a estrutura (nomes das chaves) exatamente como está.
#  Veja um exemplo completo em exemplos/biblioteca/grupo.yaml.
# =============================================================================

grupo:
  nome: "Grupo X"
  integrantes:          
    - nome: "Kauã Finotti Rios"
      rga: "2024.1906.069-2"
    - nome: "Maria Eduarda da Silva de Macedo"
      rga: "TODO"
    - nome: "Klevin Ryan Ramalho Matos
      rga: "TODO"
    - nome: "Sidney Kenzo Goya Miyassato"
      rga: "2019.1906.018-9"

tema:
  nome: "Atividades complementares e extensão"
  descricao: >
    Chatbot informativo sobre as atividades de extensão e a
    curricularização na UFMS.
    O sistema auxilia estudantes a compreender as regras, modalidades,
    contabilização de horas e organização dessas atividades.

dados:                  # caminhos relativos a este arquivo - não altere
  treino: dados/treino.csv
  teste: dados/teste.csv

modelos:                # caminhos relativos a este arquivo - não altere
  escopo: modelos/escopo.joblib
  tema: modelos/tema.joblib
  # carregador: "chatbot.meu_modulo:carregar"   # opcional; ver chatbot/modelos.py

# LLM que REDIGE as respostas do bot (via OpenRouter, com a chave do grupo).
# Os classificadores decidem a ROTA; o LLM só escreve o texto da resposta.
llm:
  modelo: "openai/gpt-6-luna"   # ou o modelo indicado pelo professor
  temperatura: 0.3                       # 0 = respostas mais estáveis; 1 = mais variadas
  max_tokens: 300
  usar_em: [intencoes, chitchat]         # nós em que o LLM redige a resposta
  persona: >
    Você é um assistente virtual especializado em atividades de extensão
    da Universidade Federal de Mato Grosso do Sul (UFMS). Seu objetivo é
    auxiliar estudantes a compreender as normas e os procedimentos
    relacionados à extensão universitária. Seja cordial, didático e
    objetivo. Baseie suas respostas nos documentos oficiais fornecidos.
    Não invente informações. Quando não encontrar uma resposta nos
    documentos, informe suas limitações e indique onde o estudante
    pode buscar orientação.
  contato: "Coordenação do curso ou setor responsável pela extensão na UFMS"
  max_frases: 3
  turnos_historico: 3

# Base de conhecimento (RAG). Coloque os documentos oficiais do tema em
# documentos/ (uma subpasta por intenção + geral/). O índice vetorial é criado
# automaticamente em .vectordb/ na primeira conversa com o LLM.
conhecimento:
  pasta: documentos
  representacao: tfidf        # tfidf (padrão) ou embeddings
  tamanho_trecho: 700
  k: 4
  similaridade_minima: 0.05

roteamento:
  # Abaixo desta confiança no tema, o bot pede esclarecimento em vez de responder.
  # 0 desliga o recurso. Escolha o valor com base em dados e justifique no relatório.
  limiar_tema: 0.0

# De 5 a 10 intenções. O nome (chave) deve ter só letras minúsculas sem acento,
# dígitos e "_". "descricao" aparece nas mensagens do bot ("Posso ajudar com: ...").
intencoes:
  computo_horas_extensao:
    descricao: "Contabilização de horas de extensão"
    resposta: >
      A contabilização das horas de atividade de extensão segue critérios definidos
      pelas normas da UFMS. Consulte os documentos oficiais para verificar
      os requisitos e procedimentos.

  tipos_atividades_extensao:
    descricao: "Tipos de atividades de extensão"
    resposta: >
      Existem diferentes modalidades de atividades extensionistas.
      Consulte os documentos oficiais para conhecer os tipos de atividades
      reconhecidos pela UFMS.

  computo_horas_complementar:
    descricao: "Contabilização de horas complementares"
    resposta: >
      A contabilização das horas de atividades complementares segue critérios definidos
      pelas normas da UFMS. Consulte os documentos oficiais para verificar
      os requisitos e procedimentos.

  tipos_atividades_complementar:
    descricao: "Tipos de atividades complementares"
    resposta: >
      Existem diferentes modalidades de atividades complementares.
      Consulte os documentos oficiais para conhecer os tipos de atividades
      reconhecidos pela UFMS.

  atividades_remuneradas:
    descricao: "Atividades remuneradas"
    resposta: >
      A possibilidade de contabilizar atividades remuneradas depende
      dos critérios estabelecidos nas normas institucionais, além de estabelecer
      limites e exigências formais em relação à documentação dessas atividades. Consulte
      os documentos oficiais para verificar as condições aplicáveis.

# Respostas dos nós que não são intenções. {assuntos} vira a lista de descrições
# das intenções; {opcao1}/{opcao2}, as duas intenções mais prováveis.
respostas:
  chitchat:
    saudacao: "Olá! Como posso ajudar com atividades de extensão na UFMS?"
    agradecimento: "Por nada! Estou à disposição."
    despedida: "Até logo!"
    padrao: "Posso ajudar com informações sobre: {assuntos}."

  fora_dominio: >
    Desculpe, não consigo responder sobre esse assunto.
    Posso ajudar com: {assuntos}.

  esclarecer: >
    Não tenho certeza se entendi. Sua dúvida é sobre {opcao1}
    ou sobre {opcao2}?
